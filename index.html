<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0e1a" />
    <title>Penalty Kick</title>
    <script type="module" crossorigin src="/fount-contracts/assets/index-B9c_vac3.js"></script>
    <link rel="stylesheet" crossorigin href="/fount-contracts/assets/index-BwWBrvQi.css">
  </head>
  <body>
    <canvas id="scene"></canvas>

    <div id="hud">
      <div class="hud-row top">
        <div class="pill" id="challenge-pill">
          <span class="pill-label">Challenge</span>
          <span class="pill-value" id="challenge-title">—</span>
        </div>
        <div class="pill score" id="score-pill">
          <span class="pill-label">Score</span>
          <span class="pill-value" id="score-value">0 / 0</span>
        </div>
      </div>

      <div class="hud-row bottom">
        <div class="hint" id="hint">Swipe up to shoot</div>
      </div>
    </div>

    <div id="overlay" class="hidden">
      <div class="card" id="overlay-card">
        <h1 id="overlay-title">Penalty Kick</h1>
        <p id="overlay-body">Pick a challenge to begin.</p>
        <div id="challenge-list"></div>
        <button id="overlay-btn">Play</button>
      </div>
    </div>

    <div id="flash"></div>

  </body>
</html>
